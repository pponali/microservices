# Build + test all 12 modules on every push and PR.
#
# Two phases:
#   1. unit phase  — `mvn package` runs the slice/unit tests baked into each module
#   2. integration phase — `mvn test -Dintegration.tests=true` runs context-load and
#      Testcontainers-backed tests. Docker is provided by the github-runner host,
#      so Testcontainers auto-detects /var/run/docker.sock.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write

    steps:
    - uses: actions/checkout@v4

    # JDK 21 — matches <java.version> in the parent pom (was 17 before the 2026-05-03 upgrade).
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Phase 1: unit + slice tests (no Docker required).
    - name: Build and run unit + slice tests
      run: mvn -B clean package --file pom.xml

    # Phase 2: integration tests that boot the full Spring context and use Testcontainers.
    # `services` block here would be the alternative to letting Testcontainers manage containers,
    # but Testcontainers' DOCKER_HOST auto-detection on github-runner Linux is reliable enough
    # to skip declaring services explicitly.
    - name: Run integration tests
      run: mvn -B verify -Dintegration.tests=true --file pom.xml
      # Don't fail the workflow on integration test failures yet — they're a roadmap item.
      # Flip this to `continue-on-error: false` once the skeleton tests in netflix-service /
      # config-server / oauth2-client are replaced with proper assertions.
      continue-on-error: true

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
