# Continuous Deployment to OCI k3s VM (apps.khetisahayak.com).
#
# Pipeline:
#   1. detect-changes  — diff vs. previous commit; output the list of modules whose
#                        directory changed (or all modules, if shared files like the
#                        parent pom, helm chart, or this workflow changed).
#   2. build-push      — matrix job, ARM-native runner, builds + pushes each changed
#                        module's image to Docker Hub (pponali/<svc>:latest and :<sha>).
#   3. deploy          — SSHes into the VM, syncs the Helm chart, runs `helm upgrade`,
#                        and `kubectl rollout restart` on each changed Deployment so
#                        k3s pulls the new :latest image.
#
# Required GitHub repository secrets:
#   DOCKERHUB_USERNAME    — pponali
#   DOCKERHUB_TOKEN       — Docker Hub access token (Account Settings → Security)
#   SSH_HOST              — 80.225.224.96
#   SSH_USER              — ubuntu
#   SSH_KEY               — private key (full PEM, including BEGIN/END lines)
#
# Trigger:
#   - push to master (auto-deploys)
#   - manual via "Run workflow" (deploys whatever is on the branch)

name: CD - build & deploy to OCI k3s

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild and redeploy ALL services regardless of diff"
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: pponali
  HELM_RELEASE: microservices
  K8S_NAMESPACE: microservices
  CHART_PATH: helm/microservices

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.diff.outputs.services }}
      any: ${{ steps.diff.outputs.any }}
      chart_changed: ${{ steps.diff.outputs.chart_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        shell: bash
        run: |
          set -euo pipefail
          ALL=(config-server discovery-service authorization-service resource-server oauth2-client \
               apigateway gateway-service user-service catalog-service product-service \
               inventory-service order-service notification-service integration-service common-service)

          # Decide base ref for the diff
          if [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" && -n "${{ github.event.before }}" ]]; then
            BASE="${{ github.event.before }}"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            BASE=HEAD~1
          else
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Diffing against $BASE"
          CHANGED_FILES=$(git diff --name-only "$BASE"..HEAD || true)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          force_all="${{ inputs.force_all }}"
          rebuild_all=false
          chart_changed=false

          if echo "$CHANGED_FILES" | grep -qE '^helm/'; then chart_changed=true; fi
          if [[ "$force_all" == "true" ]] \
             || echo "$CHANGED_FILES" | grep -qE '^(pom\.xml|\.github/workflows/cd\.yml)$'; then
            rebuild_all=true
          fi

          CHANGED=()
          if $rebuild_all; then
            CHANGED=("${ALL[@]}")
          else
            for s in "${ALL[@]}"; do
              if echo "$CHANGED_FILES" | grep -q "^$s/"; then CHANGED+=("$s"); fi
            done
          fi

          echo "chart_changed=$chart_changed" >> "$GITHUB_OUTPUT"
          if [[ ${#CHANGED[@]} -eq 0 ]]; then
            echo "No services changed."
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "services=[]" >> "$GITHUB_OUTPUT"
          else
            echo "Changed services: ${CHANGED[*]}"
            JSON=$(printf '%s\n' "${CHANGED[@]}" | jq -R . | jq -sc .)
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "services=$JSON" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.any == 'true'
    # ARM-native runner — matches the OCI Ampere VM, no QEMU emulation.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no Dockerfile
        id: check
        run: |
          if [[ -f "${{ matrix.service }}/Dockerfile" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No Dockerfile in ${{ matrix.service }} — skipping image build."
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.skip != 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    needs: [detect-changes, build-push]
    if: needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync chart to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "helm/,scripts/"
          target: "/home/${{ secrets.SSH_USER }}/microservices/"
          overwrite: true
          strip_components: 0

      - name: Helm upgrade & rollout-restart changed services
        uses: appleboy/ssh-action@v1.0.3
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
          CHART_CHANGED: ${{ needs.detect-changes.outputs.chart_changed }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: CHANGED_SERVICES,CHART_CHANGED,GITHUB_SHA
          script: |
            set -euo pipefail
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            sudo chmod +r "$KUBECONFIG"
            cd ~/microservices

            # Helm bootstrap (idempotent)
            if ! command -v helm >/dev/null 2>&1; then
              curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            fi

            # cert-manager intentionally not installed — host nginx (Certbot) handles TLS
            # for apps.khetisahayak.com and reverse-proxies into the apigateway NodePort.

            # Apply chart (idempotent — re-renders templates with current values)
            helm upgrade --install microservices ./helm/microservices \
              --create-namespace -n microservices \
              --set global.image.tag=latest

            # Force rolling update for each changed service so it pulls the new :latest image.
            echo "$CHANGED_SERVICES" | jq -r '.[]' | while read -r svc; do
              if kubectl -n microservices get deployment "$svc" >/dev/null 2>&1; then
                echo ">>> rollout restart $svc"
                kubectl -n microservices rollout restart deployment "$svc"
                kubectl -n microservices annotate deployment "$svc" \
                  "deploy.sha=$GITHUB_SHA" --overwrite
              fi
            done

            # Wait for rollouts (best-effort, doesn't fail the job on long pulls)
            echo "$CHANGED_SERVICES" | jq -r '.[]' | while read -r svc; do
              kubectl -n microservices rollout status deployment "$svc" --timeout=300s || true
            done

            kubectl -n microservices get pods -o wide
