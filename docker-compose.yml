# Mirrors the k3s deployment on the OCI VM (helm/microservices/values.yaml).
# Infra (mysql/mongodb/redis/kafka) + 13 Spring Boot services + 2 user-service replicas.
#
# Usage:
#   docker-compose up -d --build
#   docker-compose logs -f apigateway
#   docker-compose down -v        # -v also wipes the persistent volumes
#
# Service DNS names match the k8s Service names so app config (e.g. mysql:3306)
# is identical between local compose and the cluster.

x-spring-app: &spring-app
  restart: unless-stopped
  depends_on:
    - discovery-service

services:
  # ---------------- Infrastructure ----------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: sptools_storage
      MYSQL_USER: sptools
      MYSQL_PASSWORD: sptools
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

  # ---------------- Platform ----------------
  config-server:
    build: { context: ., dockerfile: config-server/Dockerfile }
    container_name: config-server
    environment:
      SPRING_PROFILES_ACTIVE: native
    ports:
      - "8888:8080"

  discovery-service:
    build: { context: ., dockerfile: discovery-service/Dockerfile }
    container_name: discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---------------- Security ----------------
  authorization-service:
    <<: *spring-app
    build: { context: ., dockerfile: authorization-service/Dockerfile }
    container_name: authorization-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sptools_storage
      SPRING_DATASOURCE_USERNAME: sptools
      SPRING_DATASOURCE_PASSWORD: sptools
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      - discovery-service
      - mysql

  resource-server:
    <<: *spring-app
    build: { context: ., dockerfile: resource-server/Dockerfile }
    container_name: resource-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    ports:
      - "8090:8090"

  oauth2-client:
    <<: *spring-app
    build: { context: ., dockerfile: oauth2-client/Dockerfile }
    container_name: oauth2-client
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    ports:
      - "5555:5555"

  # ---------------- Edge ----------------
  apigateway:
    <<: *spring-app
    build: { context: ., dockerfile: apigateway/Dockerfile }
    container_name: apigateway
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka/
    ports:
      - "8080:8080"

  # ---------------- Business apps ----------------
  user-service-1:
    <<: *spring-app
    build: { context: ., dockerfile: user-service/Dockerfile }
    container_name: user-service-1
    environment:
      SERVER_PORT: 8081
      EUREKA_URL: http://discovery-service:8761/eureka/

  user-service-2:
    <<: *spring-app
    build: { context: ., dockerfile: user-service/Dockerfile }
    container_name: user-service-2
    environment:
      SERVER_PORT: 8081
      EUREKA_URL: http://discovery-service:8761/eureka/

  catalog-service:
    <<: *spring-app
    build: { context: ., dockerfile: catalog-service/Dockerfile }
    container_name: catalog-service
    environment:
      SERVER_PORT: 8082
      EUREKA_URL: http://discovery-service:8761/eureka/
    ports:
      - "8082:8082"

  product-service:
    <<: *spring-app
    build: { context: ., dockerfile: product-service/Dockerfile }
    container_name: product-service
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/product-service
      REDIS_HOST: redis
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      - discovery-service
      - mongodb
      - redis

  inventory-service:
    <<: *spring-app
    build: { context: ., dockerfile: inventory-service/Dockerfile }
    container_name: inventory-service
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sptools_storage
      SPRING_DATASOURCE_USERNAME: sptools
      SPRING_DATASOURCE_PASSWORD: sptools
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      - discovery-service
      - mysql

  order-service:
    <<: *spring-app
    build: { context: ., dockerfile: order-service/Dockerfile }
    container_name: order-service
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sptools_storage
      SPRING_DATASOURCE_USERNAME: sptools
      SPRING_DATASOURCE_PASSWORD: sptools
      REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      - discovery-service
      - mysql
      - redis
      - kafka

  notification-service:
    <<: *spring-app
    build: { context: ., dockerfile: notification-service/Dockerfile }
    container_name: notification-service
    environment:
      SERVER_PORT: 8080
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      - discovery-service
      - kafka

  integration-service:
    <<: *spring-app
    build: { context: ., dockerfile: integration-service/Dockerfile }
    container_name: integration-service
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/

volumes:
  mysql-data:
  mongo-data:
