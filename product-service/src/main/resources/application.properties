spring.application.name=product-service
server.port=0

spring.data.mongodb.uri=mongodb://localhost:27017/product-service
eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka

# Redis-backed Spring Cache (see CacheConfig for the bean wiring + TTL).
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Tracing (Spring Cloud Sleuth deps removed in Boot 3 in favor of Micrometer Tracing
# but kept this property for documentation; harmless if unused).
management.tracing.sampling.probability=1.0
