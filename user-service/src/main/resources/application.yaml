server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # in Docker we want Eureka to register the container IP, not the hostname
    prefer-ip-address: true
    # unique per replica so Eureka can list both instances
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
