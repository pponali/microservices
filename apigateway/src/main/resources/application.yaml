server:
  port: 8080

spring:
  application:
    # No spaces — Eureka uses this as the service id and lb:// uri host.
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          # We define explicit routes below for clarity.
          # Set this to true if you want every Eureka service auto-exposed at /<service-id>/**.
          enabled: false
          lower-case-service-id: true
      routes:
        - id: user-service
          # lb://<service-name> — gateway looks up "user-service" in Eureka
          # and the LoadBalancer picks an instance per request.
          # This is server-side load balancing from the external client's POV.
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/catalog/**
          filters:
            # remove the first segment of the path /api/catalog/** => /catalog/**
            - StripPrefix=1
        # ---- Aggregated Swagger pass-through routes ----
        # Each downstream service exposes /v3/api-docs locally; the gateway re-exposes
        # them on distinct paths so a single Swagger UI on the gateway can list them all.
        - id: user-service-docs
          uri: lb://user-service
          predicates:
            - Path=/v3/api-docs/users
          filters:
            - SetPath=/v3/api-docs
        - id: catalog-service-docs
          uri: lb://catalog-service
          predicates:
            - Path=/v3/api-docs/catalog
          filters:
            - SetPath=/v3/api-docs
        - id: config-service-docs
          uri: lb://config-service
          predicates:
            - Path=/v3/api-docs/config
          filters:
            - SetPath=/v3/api-docs
        - id: eureka-service
          uri: lb://eureka-service
          predicates:
            - Path=/eureka/**
          filters:
            - StripPrefix=1

# Aggregated Swagger UI: served from the gateway at /swagger-ui.html with a
# dropdown that switches between each service's OpenAPI doc (fetched via the
# pass-through routes above).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /v3/api-docs/users
      - name: catalog-service
        url: /v3/api-docs/catalog
      - name: config-service
        url: /v3/api-docs/config
      - name: eureka-service
        url: /eureka/v2/api-docs


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
