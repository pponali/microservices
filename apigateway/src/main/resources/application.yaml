server:
  port: 8080

spring:
  application:
    name: API GATEWAY
  cloud:
    gateway:
      routes: 
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: catalog-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/catalog/**
          filters:
            # remove the first segment of the path /api/catalog/** => /catalog/**
            - StripPrefix=1 
