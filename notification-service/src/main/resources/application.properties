eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka
spring.application.name=notification-service
server.port=0

# H2 in-memory store for webhook subscriptions. Swap for MySQL/Postgres in production.
spring.datasource.url=jdbc:h2:mem:notifications;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.sleuth.integration.enabled=true
spring.zipkin.base-url=http://localhost:9411/
spring.sleuth.sampler.probability=1

# Kafka Properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=notificationTopic
spring.kafka.consumer.group-id= notificationId
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=event:com.programming.techie.OrderPlacedEvent

# --- Resilience4j: outbound webhook rate limiter ---
# Cap webhook deliveries to 10/sec across all subscribers so a burst of order events
# can't hammer customer endpoints (or trip their own rate limits). Callers that
# can't get a permit within 0ms get RequestNotPermitted and retry on backoff.
resilience4j.ratelimiter.instances.webhook-delivery.limit-for-period=10
resilience4j.ratelimiter.instances.webhook-delivery.limit-refresh-period=1s
resilience4j.ratelimiter.instances.webhook-delivery.timeout-duration=0
resilience4j.ratelimiter.instances.webhook-delivery.register-health-indicator=true

# --- Actuator + Prometheus ---
# Resilience4j auto-publishes metrics (resilience4j_ratelimiter_*, _circuitbreaker_*,
# _retry_*, _bulkhead_*, _timelimiter_*) to Micrometer when the registry is on the
# classpath. Scrape at /actuator/prometheus.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
