{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $root.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    tier: {{ $svc.tier | default "app" }}
spec:
  type: {{ if $svc.nodePort }}NodePort{{ else }}ClusterIP{{ end }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      name: http
      {{- if $svc.nodePort }}
      nodePort: {{ $svc.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: {{ $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $root.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    tier: {{ $svc.tier | default "app" }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        tier: {{ $svc.tier | default "app" }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $root.Values.global.image.registry }}/{{ $root.Values.global.image.repository }}/{{ $name }}:{{ $root.Values.global.image.tag }}
          imagePullPolicy: {{ $root.Values.global.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
{{- if not (hasKey ($svc.env | default dict) "SPRING_PROFILES_ACTIVE") }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ $svc.profile | default "k8s" }}
{{- end }}
{{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
{{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ $svc.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: {{ $svc.port }}
            initialDelaySeconds: 120
            periodSeconds: 20
          resources:
{{ toYaml $root.Values.resources.default | indent 12 }}
{{- end }}
{{- end }}
